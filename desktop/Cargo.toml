[package]
name = "obliterator-desktop"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "obliterator-desktop"
path = "src/main.rs"

[dependencies]
obliterator-discovery = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
