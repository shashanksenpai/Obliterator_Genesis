[package]
name = "obliterator-discovery"
version = "0.2.0"
edition = "2021"

[lib]
name = "obliterator_discovery"
path = "src/lib.rs"

[[bin]]
name = "obliterator-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
html-escape = "0.2"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# For testing purposes